[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaster"
version = "0.1.0"
description = "JAX implementation of NaMaster"
readme = "README.md"
requires-python = ">=3.10"
# PyPI s2fft 1.4.0 does `from s2fft_lib import _s2fft` at import (breaks Colab
# Python 3.13, where the CUDA extension is a namespace without `_s2fft`) and
# lacks `s2fft.transforms._ftm_flm_primitive` (gmaster.utils). Pin the first
# revision that has both the optional import (astro-informatics/s2fft#362) and
# the primitive (astro-informatics/s2fft#380).
dependencies = [
    "fitsio",
    "healpy",
    "jax",
    "numpy",
    "s2fft @ git+https://github.com/astro-informatics/s2fft.git@86a4dff303539202ebbfa28661d85331e0e2bff4",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "march_v2: exercise the shipped v2 CUDA march (unit tests otherwise pin GMASTER_MARCH_V2=0)",
]

[tool.setuptools]
packages = ["gmaster"]

# The v2 march compiles gmaster/_cuda/march_v2.cu with nvcc on first use; without this a
# non-editable install (pip install git+...) ships no .cu and the march is silently unavailable.
[tool.setuptools.package-data]
gmaster = ["_cuda/*.cu"]
