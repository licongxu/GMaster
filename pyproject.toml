[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaster"
version = "0.1.0"
description = "JAX implementation of NaMaster"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fitsio", "healpy", "jax", "numpy", "s2fft", "scipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["gmaster"]
