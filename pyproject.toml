[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaster"
version = "0.1.0"
description = "JAX implementation of NaMaster"
readme = "README.md"
requires-python = ">=3.10"
# gmaster.utils imports s2fft.transforms._ftm_flm_primitive, which is on s2fft main after the
# 1.4.0 release (PyPI's latest), so the dependency points at the repository.
dependencies = [
    "fitsio",
    "healpy",
    "jax",
    "numpy",
    "s2fft @ git+https://github.com/astro-informatics/s2fft.git",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["gmaster"]

# The v2 march compiles gmaster/_cuda/march_v2.cu with nvcc on first use; without this a
# non-editable install (pip install git+...) ships no .cu and the march is silently unavailable.
[tool.setuptools.package-data]
gmaster = ["_cuda/*.cu"]
